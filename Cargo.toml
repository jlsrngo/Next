[package]
name = "portfolio-rust-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src-server/main.rs"

[[bin]]
name = "health"
path = "api/health.rs"

[[bin]]
name = "stats"
path = "api/stats.rs"

[[bin]]
name = "profile"
path = "api/profile.rs"

[[bin]]
name = "projects"
path = "api/projects.rs"

[[bin]]
name = "skills"
path = "api/skills.rs"

[[bin]]
name = "dashboard"
path = "api/dashboard.rs"

[[bin]]
name = "about"
path = "api/about.rs"

[dependencies]
vercel_runtime = "1.1.0"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "macros"] }
